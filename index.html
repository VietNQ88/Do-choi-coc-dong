<script>
// App đã chuyển sang trang menu chung: gỡ bộ nhớ offline cũ rồi chuyển hướng
(async () => {
  try { const regs = await navigator.serviceWorker?.getRegistrations?.() || []; await Promise.all(regs.map(r => r.unregister())); } catch {}
  try { const keys = await caches.keys(); await Promise.all(keys.filter(k => k.startsWith('do-choi-')).map(k => caches.delete(k))); } catch {}
  location.replace('https://vietnq88.github.io/do-choi/');
})();
</script>
